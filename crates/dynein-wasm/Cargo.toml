#
# In-browser dynein: the real awslabs/dynein command layer (vendored, Apache-2.0)
# compiled to wasm, driving extenddb_engine::dispatch in-process via a custom
# aws-smithy HttpConnector. No network. Data-plane + control-read commands;
# fs/network-heavy dynein modules (batch/bootstrap/transfer) are not vendored.
#
# Standalone (own [workspace], excluded from the ExtendDB workspace) so the AWS
# SDK dep tree never enters the shipped build. Build: scripts/dynein-wasm-build.sh
[package]
name = "extenddb-dynein-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# vendored dynein deps that build on wasm
aws-sdk-dynamodb       = { version = "1.93", default-features = false }
aws-smithy-runtime-api = { version = "1.9", features = ["client", "http-02x"] }
aws-smithy-runtime     = { version = "1", default-features = false, features = ["client"] }
aws-smithy-types       = { version = "1", features = ["http-body-0-4-x"] }
aws-smithy-async       = { version = "1" }
aws-credential-types   = { version = "1", features = ["hardcoded-credentials"] }
aws-types              = { version = "1" }
clap        = { version = "4.5", features = ["derive"] }
futures     = "0.3"
log         = "0.4"
regex       = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
tabwriter   = "1.4"
pest        = "2.7"
pest_derive = "2.7"
bytes       = "1"
itertools   = "0.13"
base64      = "0.22"
thiserror   = "1"
chrono      = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

# ExtendDB engine, linked directly into the same wasm module.
extenddb-core                = { path = "../core" }
extenddb-storage             = { path = "../storage" }
extenddb-engine              = { path = "../engine" }
extenddb-storage-sqlite-wasm = { path = "../storage-sqlite-wasm" }
extenddb-auth                = { path = "../auth" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
