[package]
name = "extenddb-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
extenddb-core = { workspace = true }
extenddb-cache = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
# `http` rather than `axum::http`: axum re-exports this crate unchanged, so the
# types are identical, and taking it directly drops axum from this crate's
# dependency graph on every target. It does not remove tokio or mio from the
# graph extenddb-engine sees: those still arrive through extenddb-engine and
# extenddb-storage, and what changes is that this crate is no longer one of
# those paths. They also stay in this crate's own tree through the tokio
# dev-dependency below, which cargo tree reports unless you pass --edges
# normal, and on native through extenddb-cache.
http = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde_json = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
extenddb-cache = { workspace = true, features = ["test-util"] }

# Ungated, tokio puts itself and mio in this crate's wasm dependency graph, which
# every absence check in the wasm work reads, and it breaks the wasm test target
# because cargo builds dev-dependencies for it. The test modules that use it are
# gated to match.
#   cargo tree --target wasm32-unknown-unknown -p extenddb-auth -i mio
#     exits 0 and prints nothing.
#   cargo check --target wasm32-unknown-unknown --all-targets -p extenddb-auth
#     exits 0.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
