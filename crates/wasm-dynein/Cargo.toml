#
# Stage B integration: aws-sdk-dynamodb + the real ExtendDB engine in ONE wasm
# module. The SDK's transport is an in-process connector that calls
# extenddb_engine::dispatch directly (no network, no JS bounce).
#
# Standalone (own [workspace] table) and excluded from the parent workspace so
# it never adds the AWS SDK dep tree to the shipped ExtendDB build. Build with:
#   scripts/wasm-dynein-build.sh
[package]
name = "extenddb-wasm-dynein"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extenddb-core                = { path = "../core" }
extenddb-storage             = { path = "../storage" }
extenddb-engine              = { path = "../engine" }
extenddb-storage-sqlite-wasm = { path = "../storage-sqlite-wasm" }
extenddb-auth                = { path = "../auth" }
serde_json = "1"

aws-sdk-dynamodb       = { version = "1.93", default-features = false }
aws-smithy-runtime-api = { version = "1.9", features = ["client", "http-02x"] }
aws-smithy-runtime     = { version = "1", default-features = false, features = ["client"] }
aws-smithy-types       = { version = "1", features = ["http-body-0-4-x"] }
aws-credential-types   = { version = "1", features = ["hardcoded-credentials"] }
aws-smithy-async       = { version = "1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
